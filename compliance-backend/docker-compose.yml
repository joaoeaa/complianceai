services:
  # ─── PostgreSQL ───
  postgres:
    image: pgvector/pgvector:pg15
    container_name: compliance_db
    environment:
      POSTGRES_USER: compliance_user
      POSTGRES_PASSWORD: compliance_pass
      POSTGRES_DB: compliance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance_user -d compliance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───
  # Serviço único: a análise roda em thread dentro da própria api.
  api:
    build: .
    container_name: compliance_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
      - ./.env:/app/.env
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: