#  GABARITO NÃO REVISADO POR PROFISSIONAL
#  Escrito para medir o prompt de análise, sem revisão de advogado.
#  Antes de tratar o resultado como medida de qualidade jurídica, peça
#  a alguém da área que confira cada item, a gravidade e a base legal.
# =====================================================================
revisado_por_profissional: false

contrato: 02_locacao_comercial.txt
tipo: Locação de imóvel não residencial (loja), entre duas empresas, com fiador
observacoes: >
  Os problemas vêm quase todos da Lei do Inquilinato (Lei 8.245/1991). Há também
  cláusulas que parecem desfavoráveis à locatária mas são válidas na locação
  comercial; elas estão em nao_devem_aparecer.

problemas_esperados:
  - id: renuncia-a-renovatoria
    clausula: "2.2"
    problema: Renúncia antecipada ao direito de renovação compulsória (ação renovatória), em contrato de 5 anos que preenche os requisitos dela.
    gravidade: alta
    base_legal: ["Art. 45, Lei 8.245/1991", "Art. 51, Lei 8.245/1991"]

  - id: reajuste-mensal-e-indice-da-locadora
    clausula: "3.2"
    problema: Reajuste mensal, quando a periodicidade mínima é anual, e por índice que a locadora pode trocar sozinha.
    gravidade: média
    base_legal: ["Art. 2º, Lei 10.192/2001", "Art. 122, Código Civil", "Art. 18, Lei 8.245/1991"]

  - id: garantias-cumuladas
    clausula: "4.1 e 4.2"
    problema: Exige fiança e caução ao mesmo tempo; a lei veda mais de uma modalidade de garantia no mesmo contrato.
    gravidade: alta
    base_legal: ["Art. 37, Lei 8.245/1991"]

  - id: caucao-acima-de-tres-alugueis
    clausula: "4.2"
    problema: Caução em dinheiro de 6 aluguéis, acima do máximo de 3 meses de aluguel.
    gravidade: média
    base_legal: ["Art. 38, Lei 8.245/1991"]

  - id: vistoria-sem-aviso
    clausula: "7.1"
    problema: Ingresso da locadora no imóvel a qualquer tempo e sem aviso; a vistoria depende de combinação prévia de dia e hora.
    gravidade: média
    base_legal: ["Art. 23, Lei 8.245/1991"]

  - id: multa-de-devolucao-sem-proporcionalidade
    clausula: "8.1"
    problema: Multa pela devolução antecipada igual a todos os aluguéis restantes, sem redução proporcional ao tempo cumprido.
    gravidade: alta
    base_legal: ["Art. 4º, Lei 8.245/1991", "Art. 413, Código Civil"]

nao_devem_aparecer:
  - id: renuncia-a-benfeitorias
    clausula: "6.1"
    o_que_seria_errado: Dizer que a renúncia à indenização e à retenção por benfeitorias úteis ou voluptuárias é nula ou abusiva.
    por_que: A lei permite que o contrato afaste essa indenização (art. 35 da Lei 8.245/1991; Súmula 335 do STJ), e a cláusula nem alcança as benfeitorias necessárias.

  - id: iptu-e-condominio-pela-locataria
    clausula: "5.1"
    o_que_seria_errado: Apontar como abusivo atribuir à locatária o IPTU e as despesas ordinárias de condomínio.
    por_que: A lei admite que o contrato transfira o IPTU (art. 22, VIII) e põe as despesas ordinárias de condomínio a cargo do locatário (art. 23, XII).

  - id: multa-de-mora-de-dez-por-cento
    clausula: "3.3"
    o_que_seria_errado: Dizer que a multa moratória de 10% é abusiva ou limitada a 2%.
    por_que: Locação comercial entre empresas não é relação de consumo; 10% é percentual usual. Ponto que admite discussão; revisar.

  - id: renuncia-ao-beneficio-de-ordem
    clausula: "4.1"
    o_que_seria_errado: Dizer que a renúncia do fiador ao benefício de ordem é nula.
    por_que: É permitida (art. 828, I, do Código Civil) e comum em fiança locatícia. O problema da cláusula 4 é a cumulação de garantias, não a fiança em si.

  - id: foro-do-imovel
    clausula: "9.1"
    o_que_seria_errado: Apontar o foro eleito como problema.
    por_que: É o foro do lugar do imóvel, o mesmo que a lei indica (art. 58, II).
